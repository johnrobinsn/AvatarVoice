[project]
name = "avatarvoice"
version = "0.2.0"
description = "Real-time voice chat with a lip-synced diffusion head-avatar (AvatarForcing), on Linux + NVIDIA or macOS + Apple Silicon"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
    # AvatarForcing (avatarforcing/requirements.txt)
    "torch>=2.7",
    "torchvision",
    "numpy<2.3",
    "pyyaml",
    "pandas>=2",
    "matplotlib",
    "omegaconf>=2.3",
    "timm==1.0.9",
    "av",
    "librosa>=0.11",
    "albumentations>=2.0",
    "opencv-python-headless",
    # AvatarForcing's wav2vec2 wrapper sets config.output_attentions, which newer
    # transformers rejects with SDPA attention. See [tool.uv] for its tokenizers pin.
    "transformers==4.30.2",
    "huggingface-hub>=0.24,<1.0",
    "safetensors",
    "regex",
    "requests",
    "tqdm",
    "pillow",
    "gdown>=5",
    # voice chat
    "aiortc",
    "aiohttp",
    "httpx",
    "scipy",
    # Silero VAD / Smart Turn use ONNX Runtime on the CPU. Linux gets the GPU build (which
    # includes the CPU provider) for Parakeet; see override-dependencies.
    "onnxruntime; sys_platform == 'darwin'",
    "onnxruntime-gpu; sys_platform == 'linux'",
    "silero-vad",
    "ptts>=0.7",
    "face-alignment",
    "openai",
    # Linux + NVIDIA: Parakeet STT via onnx-asr (default, AF_STT=parakeet); faster-whisper fallback
    "onnx-asr[hub]; sys_platform == 'linux'",
    "faster-whisper; sys_platform == 'linux'",
    # macOS + Apple Silicon: MLX flow transformer, Parakeet STT
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "parakeet-mlx>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
avatarvoice = "voicechat.launcher:main"

[tool.uv]
# The two supported setups: macOS on Apple Silicon (Python 3.12) and Linux x86_64 with an
# NVIDIA GPU (Python 3.11 — server.py preloads CUDA libs from .venv/lib/python3.11).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
]
# transformers 4.30.2 needs tokenizers<0.14, which has no Python 3.12 wheels. Linux keeps it
# (faster-whisper uses it); on macOS nothing needs it (wav2vec2 has no tokenizer, Parakeet
# brings its own), so it's dropped there.
#
# onnxruntime and onnxruntime-gpu install into the same `onnxruntime` package and clobber
# each other; faster-whisper and silero-vad depend on the CPU one. Keep it on macOS only, so
# Linux has just onnxruntime-gpu.
override-dependencies = [
    "tokenizers>=0.13.3,<0.14; sys_platform == 'linux'",
    "onnxruntime; sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
# CUDA 12.8 builds (needed for Blackwell GPUs); also provide the cuBLAS / cuDNN 9 libs
# faster-whisper's ctranslate2 loads.
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicechat"]
